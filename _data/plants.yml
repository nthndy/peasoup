# Plant inventory. Add an entry per plant. Duplicate a block to add a new one.
#
# Each plant carries its history as `checks`, a list of dated health checks,
# newest-first. The first entry in `checks` is the plant's current state —
# there is no separate top-level status/checked field any more.
#
# checks[].status: one of  planted | thriving | steady | struggling | lost
#   planted    = mauve,       just went in, no verdict yet
#   thriving   = green,        growing well
#   steady     = light green, holding, no change
#   struggling = magenta,      needs attention
#   lost       = grey,         died / removed (kept for the record)
#
# checks[].note: optional.
# checks[].photos: optional list of paths under /assets/img/. Most checks
#   won't have any — omit the key entirely rather than leaving it blank.
#
# zone: marginal | oxygenator | floating | deep-water | bog
# added: date the plant went in (YYYY-MM-DD)
# init_photo: optional path under /assets/img/ to that plant's initial
#   planting photo, shown as a popover when its card is clicked. Omit
#   entirely if there's no matching photo — don't leave it blank.

- name: Hornwort
  latin: Ceratophyllum demersum
  zone: oxygenator
  added: 2026-07-02
  notes: Weighted bunch. Throw on the surface and it sinks, or push into soil.
  init_photo: /assets/img/hornwort_init.jpg
  checks:
    - date: 2026-07-25
      status: struggling
      note: >-
        Dark olive rather than vibrant green, with a pale crust on the older
        growth — biogenic decalcification, calcium carbonate precipitating
        onto the leaves as it strips bicarbonate at pH 9, compounded by
        filamentous algae shading it. Still producing new shoots at the tips.
        Plan is a bulk reorder rather than a rescue.
      photos:
        - /assets/img/oxygenators_25jul.jpg
    - date: 2026-07-11
      status: steady
      note: >-
        The three bunches added on the 8th melted away within days — the
        heat and the pH of 9 did for them. The original planting is holding.
    - date: 2026-07-08
      status: thriving
      note: Three more bunches added to bulk up the oxygenators.
    - date: 2026-07-02
      status: planted
      note: Planted out.

- name: Willow moss
  latin: Fontinalis antipyretica
  zone: oxygenator
  added: 2026-07-02
  notes: Native. Prefers moving water and cooler conditions. Planting depth 20-90cm.
  checks:
    - date: 2026-07-06
      status: steady
      note: Adapting well.
    - date: 2026-07-02
      status: planted
      note: Planted out.

- name: Water starwort
  latin: Callitriche
  zone: oxygenator
  added: 2026-07-02
  notes: Native. Weighted bunch, placed just below the water line until established. Planting depth 15-45cm.
  init_photo: /assets/img/callitriche_init.jpg
  checks:
    - date: 2026-07-19
      status: struggling
      note: >-
        Only a few stems anchored. Took the floating clump and moved it onto
        one of the fountain tiers, since it prefers flowing water. Watching
        whether it takes.
    - date: 2026-07-11
      status: struggling
      note: Not anchoring itself. Viability uncertain.
    - date: 2026-07-02
      status: planted
      note: Planted out.

- name: Mare's tail
  latin: Hippuris vulgaris
  zone: oxygenator
  added: 2026-07-02
  notes: British native. Aquatic to 30cm or as a marginal. Label warns it can be invasive.
  init_photo: /assets/img/mares_init.jpg
  checks:
    - date: 2026-07-25
      status: thriving
      note: >-
        Excellent health, roughly quadrupled in size since planting. Best
        performer in the pond so far.
      photos:
        - /assets/img/mares_25jul.jpg
    - date: 2026-07-19
      status: thriving
      note: Spreading out, doing well.
    - date: 2026-07-06
      status: steady
      note: Adapting well.
    - date: 2026-07-02
      status: planted
      note: Planted out.

- name: Fibre optic plant
  latin: Scirpus cernuus
  zone: oxygenator
  added: 2026-07-02
  notes: Cotton bud grass. Up to 10cm of water. Acts as an oxygenator. Height 25-30cm, spread 50cm.
  init_photo: /assets/img/fibreoptic_init.jpg
  checks:
    - date: 2026-07-25
      status: thriving
      note: One of the strongest performers. Ordering more in the next batch.
      photos:
        - /assets/img/fibreoptic_25jul.jpg
    - date: 2026-07-19
      status: steady
      note: Raised out of the water a bit during the clear-out.
    - date: 2026-07-06
      status: steady
      note: Adapting well.
    - date: 2026-07-02
      status: planted
      note: Planted out.

- name: Water soldier
  latin: Stratiotes aloides
  zone: floating
  added: 2026-07-02
  notes: Perennial, flowers July, full sun, hardy. Drops straight in at 30cm. Sinks over winter.
  init_photo: /assets/img/water_soldier_init.jpg
  checks:
    - date: 2026-07-11
      status: lost
      note: Lost. Foliage had been falling apart since the 6th and it did not recover.
    - date: 2026-07-06
      status: struggling
      note: Foliage starting to fall apart. Not adapting well.
    - date: 2026-07-02
      status: planted
      note: Planted out.

- name: Floating heart
  latin: Nymphoides peltata
  zone: floating
  added: 2026-07-02
  notes: Native. 30-60cm of water above soil, full sun to partial shade. Flowers June-Aug.
  init_photo: /assets/img/nymphoides_init.jpg
  checks:
    - date: 2026-07-25
      status: thriving
      note: >-
        Still putting up new shoots and pads continuously. Decaying leaves
        groomed off regularly to keep the nutrient load out of the water.
      photos:
        - /assets/img/floating_heart_25jul.jpg
    - date: 2026-07-19
      status: thriving
      note: Root system sending up new stems. Spreading well.
    - date: 2026-07-11
      status: steady
      note: Anchoring well and sending up new pads, but some older pads rotting and want grooming.
    - date: 2026-07-02
      status: planted
      note: Planted out.

- name: Alba lily
  latin: Nymphaea alba
  zone: deep-water
  added: 2026-07-02
  notes: Rhizome planted at 45 degrees, weighted with pea gravel, full sun.
  init_photo: /assets/img/alba_lily_init.jpg
  checks:
    - date: 2026-07-25
      status: steady
      note: >-
        On the health watch list. Several pads on very long stems are dying
        back and are being removed as they rot, but new shoots are still
        coming up steadily. Long petioles suggest it may be sitting too deep.
      photos:
        - /assets/img/alba_lily_25jul.jpg
    - date: 2026-07-19
      status: thriving
      note: Spreading out a lot now, rearranged to give it room.
    - date: 2026-07-15
      status: thriving
      note: Going absolutely nuts. Several new pads this week.
    - date: 2026-07-08
      status: steady
      note: One new pad appearing as the larger pad dies back.
    - date: 2026-07-02
      status: planted
      note: Planted out.

