- name: Water starwort
  latin: Callitriche
  zone: oxygenator
  added: 2026-07-02
  notes: Native. Weighted bunch, placed just below the water line until established. Planting depth 15-45cm.
  init_photo: /assets/img/callitriche_init.jpg
  checks:
    - date: 2026-08-07
      status: thriving
      note: >-
        Thriving as I can't stop pulling tiny little green shoots from the water column when attempting to clear excess organic detritus.
      photos:
        - /assets/img/starwort_07aug.jpg
    - date: 2026-07-28
      status: steady
      note: >-
        Pot knocked over during the clear-out and the anchored tuft lost, but
        loose strands are turning up floating happily across the main pond —
        looks to have gone fully free-floating rather than died back.
