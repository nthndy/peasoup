      note: >-
        Doing alright but not as strong as the carex. No flower this year,
        which is normal for a first season after planting — looks to be
        putting its reserves into root establishment.
      photos:
        - /assets/img/flowering_rush_25jul.jpg
    - date: 2026-07-06
      status: steady
      note: Adapting well.
    - date: 2026-07-02
      status: planted
      note: Planted out.

- name: Brooklime
  latin: Veronica beccabunga
  zone: marginal
  added: 2026-07-02
  notes: Native shallow water plant. 0-10cm above soil. Flowers May-Aug.
  init_photo: /assets/img/beccabunga_init.jpg
  checks:
    - date: 2026-07-25
      status: steady
      note: >-
        Scorched by the hot weather since being raised out of the water, with
        less coverage around the crown. On a warning watch, but still sending
        up vertical shoots.
      photos:
        - /assets/img/beccabunga_25jul.jpg
    - date: 2026-07-19
      status: thriving
      note: Raised out of the water slightly during the clear-out. Still sending up new shoots.
    - date: 2026-07-15
      status: thriving
      note: Sending up new shoots.
    - date: 2026-07-02
      status: planted
      note: Planted out.

