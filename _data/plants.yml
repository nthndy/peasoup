- name: Flowering rush
  latin: Butomus umbellatus
  zone: marginal
  added: 2026-07-02
  notes: Height 90cm, spread 45cm. Full sun, hardy. Planting depth 5-45cm above soil.
  init_photo: /assets/img/flowering_rush_init.jpg
