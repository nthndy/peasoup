- name: Creeping jenny
  latin: "Lysimachia nummularia 'Aurea'"
  zone: marginal
  added: 2026-07-02
  notes: Spreading perennial. Flowers June-Aug. Up to 15cm of water, height to 8cm.
  init_photo: /assets/img/jenny_init.jpg
  checks:
    - date: 2026-07-25
      status: steady
      note: >-
        Browning on the older trailing leaves, attributable to scorch — the
        gold cultivar has less chlorophyll and so less capacity to dissipate
        excess light. Probably sitting too deep; plan to raise it onto one of
        the fountain ledges.
      photos:
        - /assets/img/jenny_25jul.jpg
    - date: 2026-07-19
      status: steady
      note: Algae building up on the leaves, so raised it out of the water a bit.
    - date: 2026-07-06
      status: steady
      note: Adapting well.
    - date: 2026-07-02
      status: planted
      note: Planted out.