<canvas id="ripple-canvas" class="ripple-canvas" aria-hidden="true"></canvas>
<script>
(function () {
  var canvas = document.getElementById('ripple-canvas');
  if (!canvas) { return; }
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { return; }

  var ctx = canvas.getContext('2d');
  var ripples = [];
  var lastSpawn = 0;
  var colors = ['#1a9641', '#a6d96a', '#978897', '#d02c91'];
  var dpr = window.devicePixelRatio || 1;

  function resize() {
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });
  resize();

  function hexToRgba(hex, alpha) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function spawnRipple(x, y, opts) {
    ripples.push({
      x: x, y: y,
      radius: opts.radius || 1,
      maxRadius: opts.maxRadius,
      alpha: opts.alpha,
      lineWidth: opts.lineWidth,
      speed: opts.speed,
      color: opts.color || colors[Math.floor(Math.random() * colors.length)]
    });
  }

  // Canvas is pointer-events:none and fixed to the viewport, so clientX/Y
  // map straight onto it -- and listening on window means the effect fires
  // no matter what real element (link, image, text) is under the cursor,
  // without ever intercepting the click/tap meant for that element.
  function trace(clientX, clientY) {
    var now = Date.now();
    if (now - lastSpawn < 55) { return; }
    lastSpawn = now;
    spawnRipple(clientX, clientY, { maxRadius: 28, alpha: 0.32, lineWidth: 1.5, speed: 0.55 });
  }

  function echo(clientX, clientY) {
    [0, 130, 260].forEach(function (delay, i) {
      setTimeout(function () {
        spawnRipple(clientX, clientY, {
          maxRadius: 130 + i * 26,
          alpha: 0.5 - i * 0.1,
          lineWidth: 2.5,
          speed: 1.7
        });
      }, delay);
    });
  }

  window.addEventListener('mousemove', function (e) {
    trace(e.clientX, e.clientY);
  });
  window.addEventListener('click', function (e) {
    echo(e.clientX, e.clientY);
  });

  // Touch: tap echoes like a click. Dragging traces a wake too, using a
  // passive listener so it never fights native scrolling.
  window.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    if (t) { echo(t.clientX, t.clientY); }
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    var t = e.touches[0];
    if (t) { trace(t.clientX, t.clientY); }
  }, { passive: true });

  function tick() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = ripples.length - 1; i >= 0; i--) {
      var r = ripples[i];
      r.radius += r.speed;
      r.alpha *= 0.965;
      if (r.alpha <= 0.02 || r.radius >= r.maxRadius) {
        ripples.splice(i, 1);
        continue;
      }
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
      ctx.strokeStyle = hexToRgba(r.color, r.alpha);
      ctx.lineWidth = r.lineWidth;
      ctx.stroke();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
