<section class="subscribe" id="subscribe-box">
  <button type="button" class="subscribe-close" data-subscribe-close aria-label="Dismiss">&times;</button>
  <h2 class="subscribe-heading">Get new posts by email</h2>
  <p class="subscribe-lede">A note whenever there's a new update — plants, water chemistry, wildlife.</p>
  
  <form class="subscribe-form" action="https://buttondown.email/api/emails/embed-subscribe/nthndy" method="post" target="popupwindow" onsubmit="window.open('https://buttondown.email/nthndy', 'popupwindow')">
    <label class="visually-hidden" for="subscribe-email">Email address</label>
    <input class="subscribe-input" id="subscribe-email" type="email" name="email" required placeholder="Enter your email" spellcheck="false">
    <button class="subscribe-submit" type="submit">Subscribe</button>
  </form>
  
  <a class="subscribe-powered" href="https://buttondown.email" target="_blank">Powered by Buttondown</a>
</section>

<script>
(function () {
  var box = document.getElementById('subscribe-box');
  if (!box) { return; }
  var KEY = 'peasoup-subscribe-dismissed';
  if (localStorage.getItem(KEY) === '1') {
    box.hidden = true;
    return;
  }
  var closeBtn = box.querySelector('[data-subscribe-close]');
  if (closeBtn) {
    closeBtn.addEventListener('click', function () {
      box.hidden = true;
      try { localStorage.setItem(KEY, '1'); } catch (e) {}
    });
  }
})();
</script>
